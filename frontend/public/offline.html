<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline – Billing System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 50%, #084298 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .card {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        text-align: center;
        max-width: 420px;
        width: 100%;
        color: #fff;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }

      .icon-wrap {
        width: 88px;
        height: 88px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }

      .icon-wrap svg {
        width: 44px;
        height: 44px;
        color: #fff;
        opacity: 0.9;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
      }

      p {
        font-size: 1rem;
        opacity: 0.85;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .badge {
        display: inline-block;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 999px;
        padding: 0.3rem 1rem;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 1.5rem;
        opacity: 0.9;
      }

      button {
        background: #fff;
        color: #0d6efd;
        border: none;
        border-radius: 12px;
        padding: 0.85rem 2.5rem;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        width: 100%;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      }

      button:active {
        transform: translateY(0);
      }

      .app-name {
        position: absolute;
        top: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.8rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      @media (max-width: 480px) {
        .card {
          padding: 2.5rem 1.5rem;
        }
        h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <span class="app-name">Billing System</span>

    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <div class="badge">No Internet Connection</div>

      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Check your network
        settings and try again to access your billing data.
      </p>

      <button onclick="window.location.reload()">
        Try Again
      </button>
    </div>
  </body>
</html>
